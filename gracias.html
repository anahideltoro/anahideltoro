<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>

  <title>Mensaje recibido | Anahí Del Toro</title>

  <meta
    name="description"
    content="Tu mensaje fue enviado correctamente a Anahí Del Toro."
  />

  <meta name="robots" content="noindex, follow"/>
  <meta name="theme-color" content="#9c1625"/>

  <link
    href="/assets/logo-anahi-del-toro.png"
    rel="icon"
    type="image/png"
  />

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link crossorigin href="https://fonts.gstatic.com"/>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Playfair+Display:ital,wght@0,600;1,600&amp;display=swap"
    rel="stylesheet"
  />

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-MJNWXFLEV7"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag("js", new Date());
    gtag("config", "G-MJNWXFLEV7");
  </script>

  <style>
    :root{
      --ivory:#fbfaf7;
      --white:#ffffff;
      --graphite:#242628;
      --muted:#6f6c68;
      --teal:#0d5656;
      --burgundy:#9c1625;
      --line:#ded9d2;
    }

    *{box-sizing:border-box}

    body{
      min-height:100vh;
      margin:0;
      padding:28px;
      display:grid;
      place-items:center;
      color:var(--graphite);
      background:var(--ivory);
      font-family:"DM Sans",system-ui,sans-serif;
    }

    .thank-you{
      width:min(900px,100%);
      padding:clamp(42px,8vw,92px);
      background:var(--white);
      border:1px solid var(--line);
      border-radius:30px;
      text-align:center;
    }

    .logo{
      width:150px;
      margin:0 auto 54px;
    }

    .logo img{
      display:block;
      width:100%;
    }

    .eyebrow{
      margin:0 0 18px;
      color:var(--teal);
      font-size:.76rem;
      font-weight:700;
      letter-spacing:.18em;
      text-transform:uppercase;
    }

    h1{
      margin:0 0 24px;
      font-family:"Playfair Display",Georgia,serif;
      font-size:clamp(4rem,9vw,7.4rem);
      line-height:.92;
      letter-spacing:-.045em;
    }

    h1 em{
      color:var(--burgundy);
    }

    p{
      max-width:620px;
      margin:0 auto 34px;
      color:var(--muted);
      font-size:1.08rem;
      line-height:1.7;
    }

    .button{
      min-height:54px;
      padding:0 28px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      color:#fff;
      background:var(--teal);
      border-radius:999px;
      font-weight:700;
      text-decoration:none;
    }

    .button:focus-visible{
      outline:3px solid var(--burgundy);
      outline-offset:4px;
    }
  </style>
</head>

<body>
  <main class="thank-you">
    <a class="logo" href="/" aria-label="Volver al inicio">
      <img
        src="/assets/logo-anahi-del-toro.png"
        alt="Anahí Del Toro"
      />
    </a>

    <p class="eyebrow">Mensaje recibido</p>

    <h1>Gracias por <em>escribirme.</em></h1>

    <p>
      He recibido tu mensaje. Lo leeré personalmente y responderé
      lo antes posible, normalmente dentro de las próximas 24 a 48 horas.
    </p>

    <a class="button" href="/">
      Volver al inicio
    </a>
  </main>
</body>
</html>
